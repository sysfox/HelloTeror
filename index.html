<!doctype html>
<html lang="zh-CN" data-theme="paper" data-locale="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teror Fox — 抬头看星星</title>
    <meta
      name="description"
      content="Teror Fox。人在南京，在河海读自动化，其余时间写代码、记笔记。"
    />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var theme = localStorage.getItem("teror-fox-theme")
        var locale = localStorage.getItem("teror-fox-locale")
        if (theme !== "paper" && theme !== "dusk") theme = "paper"
        if (locale !== "zh" && locale !== "en") {
          locale = (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en"
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.locale = locale
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en"
        document.querySelector('meta[name="theme-color"]').setAttribute(
          "content",
          theme === "paper" ? "#f5f5f5" : "#0a0a0a",
        )
      } catch (e) {}
    </script>
    <script
      defer
      src="https://umami.trfox.top/script.js"
      data-website-id="c522847f-2a7f-58fe-87d7-22bf0d4bf765"
    ></script>
    <script
      defer
      src="https://umami.trfox.top/recorder.js"
      data-website-id="c522847f-2a7f-58fe-87d7-22bf0d4bf765"
    ></script>
  </head>

</html>
